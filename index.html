<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOW STUDIO — Gestão Criativa</title>

<!-- ====================================================================== -->
<!-- FAVICON + ÍCONE DO APP WEB 3D GLASS EMBUTIDOS EM BASE64 (SEM ARQUIVOS) -->
<!-- ====================================================================== -->
<link id="dynamicFavicon" rel="icon" type="image/png">
<link id="dynamicShortcutIcon" rel="shortcut icon" type="image/png">
<link id="dynamicAppleIcon" rel="apple-touch-icon">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOW Studio">
<meta name="theme-color" content="#0a0a0a">

<script>
(function() {
  const faviconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <rect width="512" height="512" rx="108" fill="#050505"/>
    <g transform="translate(54, 152) scale(1.58)">
      <path d="M14 8 H38 V44 C49 35 65 32 85 32 H97 L87 56 H66 C47 56 38 66 38 80 C38 94 47 103 67 103 L58 124 C30 123 14 105 14 79 Z" fill="#FFFFFF"/>
      <polygon points="87,56 123,56 105,103 67,103" fill="#FFFFFF"/>
      <path d="M132 33 C156 35 173 47 180 65 L186 39 H207 L222 93 L236 8 H254 L229 124 H208 L193 74 L179 124 H159 L167 96 C159 113 142 124 117 124 H96 L105 103 H122 C141 103 153 94 153 80 C153 66 141 56 123 56 Z" fill="#FFFFFF"/>
    </g>
  </svg>`;

  const appGlassSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="bgGlass" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1a1a1c"/>
        <stop offset="45%" stop-color="#050506"/>
        <stop offset="100%" stop-color="#000000"/>
      </linearGradient>
      <linearGradient id="topSheen" x1="0%" y1="0%" x2="35%" y2="85%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.52"/>
        <stop offset="40%" stop-color="#ffffff" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
        <stop offset="30%" stop-color="#77777e" stop-opacity="0.35"/>
        <stop offset="70%" stop-color="#333338" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
      </linearGradient>
      <radialGradient id="bottomGlow" cx="50%" cy="98%" r="48%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
        <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="squircleClip">
        <rect x="8" y="8" width="496" height="496" rx="116"/>
      </clipPath>
    </defs>
    <g clip-path="url(#squircleClip)">
      <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bgGlass)"/>
      <path d="M 8 8 H 430 C 310 120 190 250 8 390 Z" fill="url(#topSheen)"/>
      <rect x="8" y="340" width="496" height="164" fill="url(#bottomGlow)"/>
      <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimStroke)" stroke-width="5"/>
      <rect x="10" y="10" width="492" height="492" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    </g>
    <g transform="translate(56, 154) scale(1.56)">
      <path d="M14 8 H38 V44 C49 35 65 32 85 32 H97 L87 56 H66 C47 56 38 66 38 80 C38 94 47 103 67 103 L58 124 C30 123 14 105 14 79 Z" fill="#FFFFFF"/>
      <polygon points="87,56 123,56 105,103 67,103" fill="#FFFFFF"/>
      <path d="M132 33 C156 35 173 47 180 65 L186 39 H207 L222 93 L236 8 H254 L229 124 H208 L193 74 L179 124 H159 L167 96 C159 113 142 124 117 124 H96 L105 103 H122 C141 103 153 94 153 80 C153 66 141 56 123 56 Z" fill="#FFFFFF"/>
    </g>
  </svg>`;

  function svgToPngBase64(svgText, size) {
    return new Promise((resolve) => {
      const img = new Image();
      const svgBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgText)));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => resolve(svgBase64);
      img.src = svgBase64;
    });
  }

  const favInitial = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(faviconSvg)));
  document.getElementById('dynamicFavicon').href = favInitial;
  document.getElementById('dynamicShortcutIcon').href = favInitial;

  window.addEventListener('DOMContentLoaded', async () => {
    const faviconPng64 = await svgToPngBase64(faviconSvg, 192);
    const appIcon192 = await svgToPngBase64(appGlassSvg, 192);
    const appIcon512 = await svgToPngBase64(appGlassSvg, 512);

    document.getElementById('dynamicFavicon').href = faviconPng64;
    document.getElementById('dynamicShortcutIcon').href = faviconPng64;
    document.getElementById('dynamicAppleIcon').href = appIcon512;

    const manifest = {
      name: "BOW STUDIO — Gestão Criativa",
      short_name: "BOW Studio",
      description: "Sistema de Gestão Criativa e Financeira BOW STUDIO",
      start_url: window.location.origin + window.location.pathname,
      display: "standalone",
      background_color: "#0a0a0a",
      theme_color: "#0a0a0a",
      orientation: "portrait-primary",
      icons: [
        { src: appIcon192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: appIcon512, sizes: "512x512", type: "image/png", purpose: "any" }
      ]
    };

    const manifestBase64 = 'data:application/manifest+json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestBase64;
    document.head.appendChild(link);
  });
})();
</script>
